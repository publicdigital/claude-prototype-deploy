name: Provision NETLIFY_AUTH_TOKEN for a new prototype repo

# Bridge workflow — works around a GitHub Free-org limitation: org-level
# Actions secrets are only visible to *public* repos, but prototype repos
# are private by default (see skills/new-prototype/SKILL.md). So
# NETLIFY_AUTH_TOKEN can't just be an org secret scoped to prototype repos
# the way docs/ADMIN-SETUP.md originally assumed.
#
# Instead: NETLIFY_AUTH_TOKEN lives as an org secret scoped to *this* repo
# only (fine, because claude-prototype-deploy is public). This workflow
# runs here, reads that org secret, and pushes it into the newly created
# prototype repo as an ordinary *repository* secret via `gh secret set` —
# which handles the required public-key encryption for us. The prototype
# repo's own caller workflow (`secrets: inherit`) then picks it up like any
# other repo secret, no code changes needed there.
#
# Triggered by the `new-prototype` skill via workflow_dispatch right after
# it creates (or is handed) the prototype repo. Needs ORG_SECRETS_BRIDGE_TOKEN
# — a token with permission to write Actions secrets on other repos in the
# org — see docs/ADMIN-SETUP.md.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: >-
          Name of the prototype repo (without the publicdigital/ prefix) to
          provision NETLIFY_AUTH_TOKEN into.
        required: true
        type: string

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          REPO: ${{ inputs.repo }}
        run: |
          if [ -z "$REPO" ]; then
            echo "::error::repo input is required" >&2
            exit 1
          fi
          if [[ "$REPO" == *"/"* ]]; then
            echo "::error::repo input must be a bare repo name, not owner/repo (got: $REPO)" >&2
            exit 1
          fi

      - name: Push NETLIFY_AUTH_TOKEN into the prototype repo
        env:
          GH_TOKEN: ${{ secrets.ORG_SECRETS_BRIDGE_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          REPO: ${{ inputs.repo }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ORG_SECRETS_BRIDGE_TOKEN secret is not set — see docs/ADMIN-SETUP.md" >&2
            exit 1
          fi
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret is not set — see docs/ADMIN-SETUP.md" >&2
            exit 1
          fi
          echo "$NETLIFY_AUTH_TOKEN" | gh secret set NETLIFY_AUTH_TOKEN \
            --repo "publicdigital/$REPO"
          echo "NETLIFY_AUTH_TOKEN provisioned on publicdigital/$REPO"
