name: Deploy prototype to Netlify

# Reusable workflow. Prototype repos call this via a thin caller workflow
# (see prototype-template/.github/workflows/deploy.yml) using
# `uses: publicdigital/claude-prototype-deploy/.github/workflows/deploy-prototype.yml@main`
# and `secrets: inherit`. That works because NETLIFY_AUTH_TOKEN exists as a
# plain repository secret on each prototype repo — pushed there at repo
# creation time by the provision-prototype-secret.yml bridge workflow in
# this repo (org-level Actions secrets don't reach private repos on a
# GitHub Free org, see docs/ADMIN-SETUP.md) — the caller never sees or
# handles the token itself, it just passes secrets through.
#
# On a prototype's very first deploy there is no Netlify site yet, so this
# workflow runs `netlify sites:create` on that first run (there is no
# `netlify deploy --create-site` flag — verified against `netlify-cli@17
# deploy --help`, which has no such option) and then relies on Netlify
# CLI's own `.netlify/state.json` (committed back to the prototype repo,
# which `sites:create` writes automatically by linking the new site to the
# current directory) to reuse the same site on every subsequent deploy —
# whether that state file is present is what the steps below branch on,
# checked directly rather than via a NETLIFY_SITE_ID secret (nothing ever
# populates one, so branching on it would retry `sites:create` — and fail
# on a name collision — on every deploy after the first).
#
# New Netlify projects are also private by default now (they gate every
# visitor behind "sign in with an invited Netlify account", confirmed via
# `netlify api getSite` — the fields are `sso_login: true` and
# `sso_login_context: "all"`; see
# https://www.netlify.com/blog/new-netlify-projects-are-now-private-by-default/).
# That sits in FRONT of this repo's own _headers Basic-Auth and defeats the
# entire point of a per-prototype password, so the first-deploy step below
# disables it right after creating the site.

on:
  workflow_call:
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype repo
        uses: actions/checkout@v4

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@17

      - name: Check whether a Netlify site is already linked
        id: site
        run: |
          if [ -f .netlify/state.json ]; then
            echo "linked=true" >> "$GITHUB_OUTPUT"
          else
            echo "linked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Netlify site (first deploy only)
        if: steps.site.outputs.linked == 'false'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          # `sites:create` needs an explicit --account-slug: without it, it
          # prompts interactively to choose a team whenever the token's
          # account belongs to more than a personal account (ours does —
          # "Public Digital" — see docs/ADMIN-SETUP.md step 1), which hangs
          # forever in CI. Look the slug up via the API instead of hardcoding
          # it, since it assumes a single team on the account either way.
          ACCOUNT_SLUG=$(netlify api listAccountsForUser | jq -r '.[0].slug')
          # Site names share Netlify's global *.netlify.app namespace across
          # every account, not just this org's — a bare repo name collides
          # easily (hit in practice: "skill-test" was already taken). Prefix
          # with the org name to make collisions unlikely; a real collision
          # would otherwise re-prompt interactively and hang CI the same way
          # the missing --account-slug did above.
          netlify sites:create --name "publicdigital-${GITHUB_REPOSITORY##*/}" --account-slug "$ACCOUNT_SLUG"

      - name: Ensure Netlify project is public
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          # New sites are private by default (see the file header comment
          # above) — disable that gate so only our own _headers Basic-Auth
          # controls access. Runs on every deploy, not just the first, so it
          # also fixes any site that was already created private before this
          # step existed, and stays correct if the flag is ever toggled back.
          SITE_ID=$(jq -r .siteId .netlify/state.json)
          netlify api updateSite --data "{\"site_id\": \"$SITE_ID\", \"sso_login\": false}"

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: netlify deploy --prod --dir=.

      - name: Commit Netlify site state (first deploy only)
        if: steps.site.outputs.linked == 'false'
        run: |
          if [ -f .netlify/state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f .netlify/state.json
            git commit -m "chore: record Netlify site id from first deploy [skip ci]" || echo "Nothing to commit"
            git push
          fi
