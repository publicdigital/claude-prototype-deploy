name: Deploy prototype to Netlify

# Reusable workflow. Prototype repos call this via a thin caller workflow
# (see prototype-template/.github/workflows/deploy.yml) using
# `uses: publicdigital/claude-prototype-deploy/.github/workflows/deploy-prototype.yml@main`
# and `secrets: inherit`. That works because NETLIFY_AUTH_TOKEN exists as a
# plain repository secret on each prototype repo — pushed there at repo
# creation time by the provision-prototype-secret.yml bridge workflow in
# this repo (org-level Actions secrets don't reach private repos on a
# GitHub Free org, see docs/ADMIN-SETUP.md) — the caller never sees or
# handles the token itself, it just passes secrets through.
#
# NETLIFY_SITE_ID is intentionally NOT required to pre-exist. On a
# prototype's very first deploy there is no Netlify site yet, so this
# workflow runs `netlify sites:create` on that first run (there is no
# `netlify deploy --create-site` flag — verified against `netlify-cli@17
# deploy --help`, which has no such option) and then relies on Netlify
# CLI's own `.netlify/state.json` (committed back to the prototype repo,
# which `sites:create` writes automatically by linking the new site to the
# current directory) to reuse the same site on every subsequent deploy.
# This is the simplest approach that needs no extra API calls during
# scaffolding — but it does mean the very first deploy commits a small
# state file back to the calling repo. If that turns out to be undesirable
# in practice, the alternative is to have the `new-prototype` skill call
# the Netlify API (`createSite`) during scaffolding and pass the resulting
# site ID in as `NETLIFY_SITE_ID`, skipping `sites:create` entirely.

on:
  workflow_call:
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: true
      NETLIFY_SITE_ID:
        required: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `secrets` is not readable from a step's `if:` condition (only from
    # `env:`/`run:`), so it's mirrored into job-level env here and the
    # steps below branch on `env.NETLIFY_SITE_ID` instead.
    env:
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout prototype repo
        uses: actions/checkout@v4

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@17

      - name: Deploy to Netlify (existing site)
        if: ${{ env.NETLIFY_SITE_ID != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: netlify deploy --prod --dir=. --site="$NETLIFY_SITE_ID"

      - name: Deploy to Netlify (first run — create site)
        if: ${{ env.NETLIFY_SITE_ID == '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          # First deploy for this repo: no site exists yet. `sites:create`
          # creates it and links it to the current directory (writing
          # .netlify/state.json), which the deploy below then picks up.
          netlify sites:create --name "${GITHUB_REPOSITORY##*/}"
          netlify deploy --prod --dir=.

      - name: Commit Netlify site state (first run only)
        if: ${{ env.NETLIFY_SITE_ID == '' }}
        run: |
          if [ -f .netlify/state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f .netlify/state.json
            git commit -m "chore: record Netlify site id from first deploy [skip ci]" || echo "Nothing to commit"
            git push
          fi
